[package]
name = "amd-ds-cli"
version = "0.1.0"
edition.workspace = true

[dependencies]
amd-ds = { path = "../lib", features = ["serde"] }
amd-ds-common = { path = "../common" }

clap = { version = "4.5.57", features = ["derive"] }

toml = { version = "1.1.2" }

scraper.workspace = true

serde.workspace = true

snafu.workspace = true

[[bin]]
name = "amd-ds"
path = "src/main.rs"
doc = false
